<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NegoSim — Welcome</title>
  <meta name="description" content="Sign in to NegoSim — AI-powered multi-agent negotiation platform." />
  
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/config.js"></script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="auth-page">
    
    <!-- LEFT SIDE: FORM PANEL -->
    <div class="auth-form-side">
      <div class="auth-container">
        
        <!-- Header -->
        <div class="auth-header">
          <div class="auth-brand">
            <div class="auth-brand-mark">N</div>
            <div class="auth-brand-text">NegoSim</div>
          </div>
          <h1 class="auth-title" id="auth-title">Welcome Back</h1>
          <p class="auth-subtitle" id="auth-subtitle">Sign in to your account to continue.</p>
        </div>

        <!-- Custom Animated Tab Switcher -->
        <div class="auth-tabs" id="auth-tabs">
          <div class="auth-tab-bg"></div>
          <button class="auth-tab active" id="tab-login" data-tab="login">Sign In</button>
          <button class="auth-tab" id="tab-register" data-tab="register">Create Account</button>
        </div>

        <div class="auth-message" id="auth-message">
          <span id="auth-message-icon"></span>
          <span id="auth-message-text"></span>
        </div>

        <!-- LOGIN FORM -->
        <form id="form-login" autocomplete="on">
          <div class="auth-form-group">
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input class="auth-input" type="email" id="login-email" name="email" placeholder=" " required autocomplete="email" />
              <label class="auth-floating-label" for="login-email">Email Address</label>
            </div>
          </div>

          <div class="auth-form-group">
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="auth-input" type="password" id="login-password" name="password" placeholder=" " required autocomplete="current-password" />
              <label class="auth-floating-label" for="login-password">Password</label>
              <button type="button" class="auth-pw-toggle" id="login-pw-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-submit" id="btn-login">
            <span class="auth-spinner"></span>
            <span class="auth-btn-text">Sign In</span>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" style="display:none;" autocomplete="on">
          <div class="auth-form-group">
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input class="auth-input" type="text" id="register-name" name="name" placeholder=" " required autocomplete="name" />
              <label class="auth-floating-label" for="register-name">Full Name</label>
            </div>
          </div>

          <div class="auth-form-group">
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input class="auth-input" type="email" id="register-email" name="email" placeholder=" " required autocomplete="email" />
              <label class="auth-floating-label" for="register-email">Email Address</label>
            </div>
          </div>

          <div class="auth-form-group">
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="auth-input" type="password" id="register-password" name="password" placeholder=" " required autocomplete="new-password" minlength="8" />
              <label class="auth-floating-label" for="register-password">Password (min 8 characters)</label>
              <button type="button" class="auth-pw-toggle" id="register-pw-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <!-- Animated Password Strength -->
            <div class="auth-pw-strength" id="pw-strength">
              <div class="auth-pw-strength-bar" id="pw-bar-1"></div>
              <div class="auth-pw-strength-bar" id="pw-bar-2"></div>
              <div class="auth-pw-strength-bar" id="pw-bar-3"></div>
              <div class="auth-pw-strength-bar" id="pw-bar-4"></div>
            </div>
          </div>

          <button type="submit" class="auth-submit" id="btn-register">
            <span class="auth-spinner"></span>
            <span class="auth-btn-text">Create Account</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <div class="auth-divider-line"></div>
          <span class="auth-divider-text">Or</span>
          <div class="auth-divider-line"></div>
        </div>

        <!-- Social Login -->
        <button type="button" class="auth-google-btn" id="btn-google-login">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        
      </div>
    </div>

    <!-- RIGHT SIDE: ANIMATED PANEL -->
    <div class="auth-image-side" id="auth-image-side">
      <!-- Canvas for AI negotiation network animation -->
      <canvas id="nego-canvas" aria-hidden="true"></canvas>

      <!-- Glass chips (Layer 3) -->
      <div class="nego-chips" aria-hidden="true">
        <div class="nego-chip" id="chip-1">Offer $4,200</div>
        <div class="nego-chip" id="chip-2">Counter $3,900</div>
        <div class="nego-chip" id="chip-3">Deal ✓</div>
      </div>

      <!-- Content floating over the animation -->
      <div class="auth-image-content">
        <h2>Master the Art of<br>Negotiation.</h2>
        <p>Train your skills against advanced AI agents in hyper-realistic simulations.</p>
      </div>
    </div>

  </div>

  <script>
    (() => {
      'use strict';

      // ── API Base (from config.js) ──
      const API_BASE = window.NegoSimConfig.API_BASE;

      // ── Token storage (localStorage, with graceful fallback) ──
      function storeToken(token) {
        try { localStorage.setItem('negosim_token', token); } catch (e) {
          try { sessionStorage.setItem('negosim_token', token); } catch (_) {}
        }
      }
      function getToken() {
        try { return localStorage.getItem('negosim_token') || sessionStorage.getItem('negosim_token'); } catch (_) { return null; }
      }
      function clearToken() {
        try { localStorage.removeItem('negosim_token'); localStorage.removeItem('negosim_user'); } catch (_) {}
        try { sessionStorage.removeItem('negosim_token'); sessionStorage.removeItem('negosim_user'); } catch (_) {}
      }
      function storeUser(user) {
        try { localStorage.setItem('negosim_user', JSON.stringify(user)); } catch (_) {
          try { sessionStorage.setItem('negosim_user', JSON.stringify(user)); } catch (_) {}
        }
      }

      // ── Server wake-up ping ──
      let _serverWakeMsgShown = false;
      let _wakeTimer = null;

      function pingServer() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);

        _wakeTimer = setTimeout(() => {
          if (!_serverWakeMsgShown) {
            _serverWakeMsgShown = true;
            showMessage('info', 'Server is waking up, please wait… This can take up to 30 seconds on the first visit.');
          }
        }, 4000);

        fetch(`${API_BASE}/health`, { signal: controller.signal })
          .then(() => {
            clearTimeout(timeout);
            clearTimeout(_wakeTimer);
            if (_serverWakeMsgShown) {
              _serverWakeMsgShown = false;
              showMessage('success', 'Server is ready!');
              setTimeout(() => { authMessage.className = 'auth-message'; }, 2500);
            }
          })
          .catch(() => {
            clearTimeout(timeout);
            clearTimeout(_wakeTimer);
          });
      }

      // ── Redirect Check ──
      const existingToken = getToken();
      if (existingToken) {
        if (existingToken === 'mock-token-fallback') {
          window.location.href = 'app.html';
        } else {
          fetch(`${API_BASE}/auth/me`, { headers: { 'Authorization': `Bearer ${existingToken}` }})
          .then(r => r.ok ? window.location.href = 'app.html' : clearToken())
          .catch(() => clearToken());
        }
      }

      // Ping server to wake it up on page load
      pingServer();

      // ── Tabs Logic ──
      const tabContainer = document.getElementById('auth-tabs');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const authMessage = document.getElementById('auth-message');

      function switchTab(tab) {
        authMessage.className = 'auth-message'; // hide messages
        if (tab === 'login') {
          tabContainer.classList.remove('is-register');
          tabLogin.classList.add('active');
          tabRegister.classList.remove('active');
          formLogin.style.display = 'block';
          formRegister.style.display = 'none';
          authTitle.textContent = 'Welcome Back';
          authSubtitle.textContent = 'Sign in to your account to continue.';
        } else {
          tabContainer.classList.add('is-register');
          tabRegister.classList.add('active');
          tabLogin.classList.remove('active');
          formRegister.style.display = 'block';
          formLogin.style.display = 'none';
          authTitle.textContent = 'Create Account';
          authSubtitle.textContent = 'Join the AI negotiation platform.';
        }
      }

      tabLogin.addEventListener('click', () => switchTab('login'));
      tabRegister.addEventListener('click', () => switchTab('register'));

      // ── Password Visibility ──
      function setupPwToggle(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', function() {
          const input = document.getElementById(inputId);
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          this.innerHTML = isPw 
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }
      setupPwToggle('login-pw-toggle', 'login-password');
      setupPwToggle('register-pw-toggle', 'register-password');

      // ── Password Strength ──
      const regPw = document.getElementById('register-password');
      regPw.addEventListener('input', () => {
        const val = regPw.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        
        const classes = ['', 'weak', 'fair', 'good', 'strong'];
        for (let i = 1; i <= 4; i++) {
          const bar = document.getElementById(`pw-bar-${i}`);
          bar.className = 'auth-pw-strength-bar';
          if (val.length > 0 && i <= score) {
            bar.classList.add('active', classes[score]);
          }
        }
      });

      // ── Message Helper ──
      function showMessage(type, text) {
        authMessage.className = `auth-message show ${type}`;
        document.getElementById('auth-message-icon').textContent = 
          type === 'error' ? '✕' : type === 'success' ? '✓' : 'ℹ';
        document.getElementById('auth-message-text').textContent = text;
      }

      // ── Friendly error messages ──
      function friendlyError(err, status) {
        if (!navigator.onLine) return 'No internet connection. Please check your network.';
        if (err.name === 'AbortError' || err.message?.includes('abort')) return 'Request timed out. The server may be slow — please try again.';
        if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError')) {
          return 'Cannot reach the server. It may be starting up — please wait 30 seconds and try again.';
        }
        if (status === 409) return 'An account with this email already exists. Try signing in instead.';
        if (status === 401) return 'Incorrect email or password. Please try again.';
        if (status === 429) return 'Too many attempts. Please wait a few minutes before trying again.';
        if (status === 400) return err.message || 'Please check your inputs and try again.';
        if (status >= 500) return 'Server error. Please try again in a moment.';
        return err.message || 'Something went wrong. Please try again.';
      }

      // ── Generic auth fetch with timeout + one retry ──
      async function authFetch(url, options, retried = false) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000); // 60s timeout

        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timeout);
          return res;
        } catch (err) {
          clearTimeout(timeout);
          // Retry once on network failure (not on abort)
          if (!retried && err.name !== 'AbortError') {
            await new Promise(r => setTimeout(r, 2000)); // wait 2s before retry
            return authFetch(url, options, true);
          }
          throw err;
        }
      }

      // ── Form Submissions ──
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.classList.add('loading');
        btn.disabled = true;
        authMessage.className = 'auth-message';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          showMessage('error', 'Please fill in all fields.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }

        // Show wakeup notice if request takes a while
        const wakeNotice = setTimeout(() => {
          showMessage('info', 'Server is waking up, please wait…');
        }, 4000);

        let status = 0;
        try {
          const res = await authFetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          clearTimeout(wakeNotice);
          status = res.status;
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Login failed');
          
          storeToken(data.token);
          storeUser(data.user);
          showMessage('success', 'Success! Redirecting…');
          setTimeout(() => window.location.href = 'app.html', 700);
        } catch (err) {
          clearTimeout(wakeNotice);
          showMessage('error', friendlyError(err, status));
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-register');
        btn.classList.add('loading');
        btn.disabled = true;
        authMessage.className = 'auth-message';

        const name     = document.getElementById('register-name').value.trim();
        const email    = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;

        // Front-end validation
        if (!name || !email || !password) {
          showMessage('error', 'Please fill in all fields.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }
        if (password.length < 8) {
          showMessage('error', 'Password must be at least 8 characters.');
          btn.classList.remove('loading'); btn.disabled = false;
          return;
        }

        const wakeNotice = setTimeout(() => {
          showMessage('info', 'Server is waking up, please wait…');
        }, 4000);

        let status = 0;
        try {
          const res = await authFetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          clearTimeout(wakeNotice);
          status = res.status;
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Registration failed');
          
          storeToken(data.token);
          storeUser(data.user);
          showMessage('success', 'Account created! Redirecting…');
          setTimeout(() => window.location.href = 'app.html', 700);
        } catch (err) {
          clearTimeout(wakeNotice);
          showMessage('error', friendlyError(err, status));
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ── Google OAuth ──
      setTimeout(() => {
        if (window.google?.accounts) {
          google.accounts.id.initialize({
            client_id: '', // Add your Google Client ID here when you have one
            callback: async (googleRes) => {
              let status = 0;
              try {
                const res = await authFetch(`${API_BASE}/auth/google`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ credential: googleRes.credential })
                });
                status = res.status;
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'Google login failed');
                
                storeToken(data.token);
                storeUser(data.user);
                showMessage('success', 'Logged in via Google! Redirecting…');
                setTimeout(() => window.location.href = 'app.html', 700);
              } catch (err) {
                showMessage('error', friendlyError(err, status));
              }
            }
          });
        }
      }, 500);

      document.getElementById('btn-google-login').addEventListener('click', () => {
        if (window.google?.accounts) {
          google.accounts.id.prompt((n) => {
            if (n.isNotDisplayed() || n.isSkippedMoment()) {
              showMessage('error', 'Google Sign-In is not configured yet. Please use email/password.');
            }
          });
        } else {
          showMessage('error', 'Google Sign-In is not available. Please use email and password.');
        }
      });

    })();
  </script>

  <!-- Right-panel animated canvas -->
  <script>
    (() => {
      'use strict';

      const panel  = document.getElementById('auth-image-side');
      const canvas = document.getElementById('nego-canvas');
      if (!panel || !canvas) return;

      // ── Respect prefers-reduced-motion ──
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, dpr = 1;
      let rafId = null;
      let paused = false;
      let mouse = { x: 0, y: 0 };

      // ── Theme colors (from CSS vars) ──
      const PRIMARY   = '#165C47';
      const PRIMARY_L = '#238568';
      const BG_DARK   = '#0B2D1E';   // very dark green for canvas bg
      const BG_MID    = '#0F3D28';
      const MINT      = 'rgba(120,210,170,';
      const WHITE     = 'rgba(247,250,248,';

      // ── Node count based on device capability ──
      const cores = navigator.hardwareConcurrency || 2;
      const NODE_COUNT = cores <= 2 ? 20 : cores <= 4 ? 28 : 36;
      const CONNECTION_DIST = 0.28; // fraction of panel width

      // ── Node class ──
      class Node {
        constructor(w, h, side) {
          // side: 'left' | 'right' | 'center' | 'any'
          if (side === 'left')        { this.x = Math.random() * w * 0.42;                    }
          else if (side === 'right')  { this.x = w * 0.58 + Math.random() * w * 0.42;         }
          else                        { this.x = Math.random() * w;                            }
          this.y   = Math.random() * h;
          this.vx  = (Math.random() - 0.5) * 0.18;
          this.vy  = (Math.random() - 0.5) * 0.18;
          this.r   = 2.5 + Math.random() * 2;
          this.agent = side === 'left' ? 'buyer' : side === 'right' ? 'seller' : 'neutral';
        }

        update(w, h) {
          this.x += this.vx;
          this.y += this.vy;
          // Soft bounce
          if (this.x < 5)     { this.x = 5;     this.vx *= -1; }
          if (this.x > w - 5) { this.x = w - 5; this.vx *= -1; }
          if (this.y < 5)     { this.y = 5;     this.vy *= -1; }
          if (this.y > h - 5) { this.y = h - 5; this.vy *= -1; }
        }

        draw(ctx) {
          const color = this.agent === 'buyer'  ? '#D97706'
                      : this.agent === 'seller' ? '#165C47'
                      : 'rgba(247,250,248,0.6)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          // Soft glow
          const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 4);
          grd.addColorStop(0, this.agent === 'buyer'  ? 'rgba(217,119,6,0.18)'
                             : this.agent === 'seller' ? 'rgba(22,92,71,0.18)'
                             : 'rgba(247,250,248,0.06)');
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r * 4, 0, Math.PI * 2);
          ctx.fillStyle = grd;
          ctx.fill();
        }
      }

      // ── Pulse class (offer/counter offers traveling along lines) ──
      class Pulse {
        constructor(from, to, color) {
          this.from  = from;
          this.to    = to;
          this.t     = 0;      // 0 → 1 progress
          this.speed = 0.004 + Math.random() * 0.003;
          this.color = color;
          this.done  = false;
        }

        update() {
          this.t += this.speed;
          if (this.t >= 1) { this.t = 1; this.done = true; }
        }

        draw(ctx) {
          const x = this.from.x + (this.to.x - this.from.x) * this.t;
          const y = this.from.y + (this.to.y - this.from.y) * this.t;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          // Trail
          ctx.beginPath();
          ctx.arc(x, y, 7, 0, Math.PI * 2);
          ctx.fillStyle = this.color.replace('1)', '0.18)');
          ctx.fill();
        }
      }

      // ── Deal ring (center burst when offer meets counter) ──
      class DealRing {
        constructor(x, y) {
          this.x = x; this.y = y;
          this.r = 0; this.alpha = 1; this.done = false;
        }
        update() {
          this.r     += 1.8;
          this.alpha -= 0.018;
          if (this.alpha <= 0) { this.alpha = 0; this.done = true; }
        }
        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(120,210,170,${this.alpha})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      let nodes = [];
      let buyerNodes  = [];
      let sellerNodes = [];
      let pulses = [];
      let rings  = [];

      // State machine for offer/counter cycle
      let cyclePhase  = 'offer';   // 'offer' | 'counter' | 'deal' | 'pause'
      let cycleTimer  = 0;
      let cyclePause  = 180;       // frames to pause after deal

      function initNodes() {
        nodes = [];
        const leftCount   = Math.floor(NODE_COUNT * 0.35);
        const rightCount  = Math.floor(NODE_COUNT * 0.35);
        const centerCount = NODE_COUNT - leftCount - rightCount;

        for (let i = 0; i < leftCount;   i++) nodes.push(new Node(W, H, 'left'));
        for (let i = 0; i < rightCount;  i++) nodes.push(new Node(W, H, 'right'));
        for (let i = 0; i < centerCount; i++) nodes.push(new Node(W, H, 'center'));

        buyerNodes  = nodes.filter(n => n.agent === 'buyer');
        sellerNodes = nodes.filter(n => n.agent === 'seller');
      }

      function resize() {
        dpr   = Math.min(window.devicePixelRatio || 1, 2);
        const rect = panel.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width  = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initNodes();
      }

      // ── Parallax mouse ──
      panel.addEventListener('mousemove', (e) => {
        const rect = panel.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left - W / 2) / W;  // -0.5 to +0.5
        mouse.y = (e.clientY - rect.top  - H / 2) / H;
      });
      panel.addEventListener('mouseleave', () => { mouse.x = 0; mouse.y = 0; });

      // ── Visibility pause ──
      document.addEventListener('visibilitychange', () => {
        paused = document.hidden;
        if (!paused && !reducedMotion) loop();
      });

      const io = new IntersectionObserver(entries => {
        paused = !entries[0].isIntersecting;
        if (!paused && !reducedMotion) loop();
      }, { threshold: 0.1 });
      io.observe(panel);

      // ── Render background gradient ──
      function drawBackground() {
        const grd = ctx.createLinearGradient(0, 0, W * 0.6, H);
        grd.addColorStop(0, BG_DARK);
        grd.addColorStop(0.6, BG_MID);
        grd.addColorStop(1, '#0D4A30');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
      }

      // ── Draw network lines ──
      function drawLines() {
        const distSq = (CONNECTION_DIST * W) ** 2;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            if (dx * dx + dy * dy > distSq) continue;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const alpha = (1 - dist / (CONNECTION_DIST * W)) * 0.22;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.strokeStyle = `rgba(120,210,170,${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // ── Offer/counter/deal cycle ──
      function tickCycle() {
        cycleTimer++;

        if (cyclePhase === 'offer' && pulses.length === 0) {
          // Send a few offer pulses from buyer cluster to seller cluster
          const count = 2 + Math.floor(Math.random() * 2);
          for (let i = 0; i < count; i++) {
            const from = buyerNodes[Math.floor(Math.random() * buyerNodes.length)];
            const to   = sellerNodes[Math.floor(Math.random() * sellerNodes.length)];
            if (from && to) {
              pulses.push(new Pulse(from, to, 'rgba(217,119,6,1)'));
            }
          }
          cyclePhase = 'waiting-counter';
        }

        if (cyclePhase === 'waiting-counter') {
          const allDone = pulses.every(p => p.done);
          if (allDone && pulses.length > 0) {
            // Slight pause, then counter
            setTimeout(() => {
              const count = 1 + Math.floor(Math.random() * 2);
              for (let i = 0; i < count; i++) {
                const from = sellerNodes[Math.floor(Math.random() * sellerNodes.length)];
                const to   = buyerNodes[Math.floor(Math.random() * buyerNodes.length)];
                if (from && to) {
                  pulses.push(new Pulse(from, to, 'rgba(35,133,104,1)'));
                }
              }
              pulses = pulses.filter(p => !p.done);
              cyclePhase = 'waiting-deal';
            }, 600);
            cyclePhase = 'transitioning';
          }
        }

        if (cyclePhase === 'waiting-deal') {
          const allDone = pulses.every(p => p.done);
          if (allDone && pulses.length > 0) {
            // Deal burst in the center
            rings.push(new DealRing(W / 2, H / 2));
            rings.push(new DealRing(W / 2, H / 2));
            pulses = [];
            cyclePhase = 'pause';
            cycleTimer = 0;
          }
        }

        if (cyclePhase === 'pause' && cycleTimer > cyclePause) {
          cycleTimer = 0;
          cyclePhase = 'offer';
        }
      }

      // ── Main draw ──
      function draw(timestamp) {
        // Apply parallax offset to ctx transform
        const px = mouse.x * 12;
        const py = mouse.y * 12;

        drawBackground();

        // Save and apply parallax shift to network layer
        ctx.save();
        ctx.translate(px, py);
        drawLines();
        nodes.forEach(n => n.update(W, H));
        nodes.forEach(n => n.draw(ctx));
        ctx.restore();

        // Pulses and rings on top (no parallax)
        pulses.forEach(p => { p.update(); p.draw(ctx); });
        pulses = pulses.filter(p => !p.done);

        rings.forEach(r => { r.update(); r.draw(ctx); });
        rings = rings.filter(r => !r.done);

        tickCycle();
      }

      function loop(timestamp) {
        if (paused) return;
        draw(timestamp);
        rafId = requestAnimationFrame(loop);
      }

      // ── ResizeObserver for proper resizing ──
      const ro = new ResizeObserver(() => {
        resize();
        if (reducedMotion) {
          // Draw one static frame
          drawBackground();
          drawLines();
          nodes.forEach(n => n.draw(ctx));
        }
      });
      ro.observe(panel);

      resize();

      if (reducedMotion) {
        // One static frame only
        drawBackground();
        drawLines();
        nodes.forEach(n => n.draw(ctx));
      } else {
        // Only run if panel is visible (not on mobile where it's hidden)
        const panelVisible = window.getComputedStyle(panel).display !== 'none';
        if (panelVisible) loop();
      }

      // ── Glass chips animation ──
      const chips = [
        document.getElementById('chip-1'),
        document.getElementById('chip-2'),
        document.getElementById('chip-3'),
      ];
      // Stagger chip animations via class cycling
      function cycleChips() {
        chips.forEach((chip, i) => {
          if (!chip) return;
          const delay = i * 3500;
          setTimeout(() => {
            function show() {
              chip.classList.add('visible');
              setTimeout(() => {
                chip.classList.remove('visible');
                setTimeout(show, 6000 + i * 1200);
              }, 3200);
            }
            show();
          }, delay);
        });
      }
      if (!reducedMotion) cycleChips();

    })();
  </script>

</body>
</html>
