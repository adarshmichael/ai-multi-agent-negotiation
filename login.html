<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NegoSim — Sign In</title>
  <meta name="description"
    content="Sign in to NegoSim — AI-powered multi-agent negotiation training and simulation platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <!-- Google Identity Services (for Google Sign-In) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <!-- Animated Background -->
  <div class="auth-bg-grid"></div>
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>
  <div class="auth-orb auth-orb-3"></div>

  <div class="auth-page">
    <div class="auth-container">

      <div class="auth-card">

        <!-- Header / Brand -->
        <div class="auth-header">
          <div class="auth-brand">
            <div class="auth-brand-mark">N</div>
            <div class="auth-brand-name">NegoSim</div>
          </div>
          <h1 class="auth-title" id="auth-title">Welcome Back</h1>
          <p class="auth-subtitle" id="auth-subtitle">Sign in to your account to access the negotiation platform.</p>
        </div>

        <!-- Tab Switcher -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" data-tab="login">Sign In</button>
          <button class="auth-tab" id="tab-register" data-tab="register">Create Account</button>
        </div>

        <!-- Body -->
        <div class="auth-body">

          <!-- Status Message -->
          <div class="auth-message" id="auth-message">
            <span id="auth-message-icon"></span>
            <span id="auth-message-text"></span>
          </div>

          <!-- LOGIN FORM -->
          <form class="auth-form" id="form-login" autocomplete="on">

            <div class="auth-form-group">
              <label class="auth-form-label" for="login-email">Email Address</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input class="auth-input" type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="login-password">Password</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input class="auth-input" type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
                <button type="button" class="auth-pw-toggle" id="login-pw-toggle" title="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="auth-submit" id="btn-login">
              <span class="auth-spinner"></span>
              <span class="auth-btn-text">Sign In</span>
              <span class="auth-btn-text">→</span>
            </button>
          </form>

          <!-- REGISTER FORM (hidden by default) -->
          <form class="auth-form" id="form-register" style="display:none;" autocomplete="on">

            <div class="auth-form-group">
              <label class="auth-form-label" for="register-name">Full Name</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input class="auth-input" type="text" id="register-name" name="name" placeholder="John Doe" required autocomplete="name" />
              </div>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="register-email">Email Address</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input class="auth-input" type="email" id="register-email" name="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="register-password">Password</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input class="auth-input" type="password" id="register-password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6" />
                <button type="button" class="auth-pw-toggle" id="register-pw-toggle" title="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <!-- Password strength -->
              <div class="auth-pw-strength" id="pw-strength">
                <div class="auth-pw-strength-bar" id="pw-bar-1"></div>
                <div class="auth-pw-strength-bar" id="pw-bar-2"></div>
                <div class="auth-pw-strength-bar" id="pw-bar-3"></div>
                <div class="auth-pw-strength-bar" id="pw-bar-4"></div>
              </div>
              <div class="auth-pw-strength-label" id="pw-strength-label"></div>
            </div>

            <button type="submit" class="auth-submit" id="btn-register">
              <span class="auth-spinner"></span>
              <span class="auth-btn-text">Create Account</span>
              <span class="auth-btn-text">→</span>
            </button>
          </form>

          <!-- Divider -->
          <div class="auth-divider">
            <div class="auth-divider-line"></div>
            <span class="auth-divider-text">or continue with</span>
            <div class="auth-divider-line"></div>
          </div>

          <!-- Google Sign-In -->
          <button type="button" class="auth-google-btn" id="btn-google-login">
            <svg class="auth-google-icon" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>

        </div>

        <!-- Footer -->
        <div class="auth-footer">
          <span class="auth-footer-text" id="auth-footer-text">
            Don't have an account? <button type="button" class="auth-footer-link" id="auth-footer-link">Create one</button>
          </span>
        </div>
      </div>

      <!-- Security badge -->
      <div class="auth-security-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Secured with JWT · AES-256 encryption</span>
      </div>

    </div>
  </div>

  <script>
    /**
     * NegoSim — Authentication Page Logic
     * Handles login, registration, Google OAuth, and token management.
     */
    (() => {
      'use strict';

      const RENDER_HOST = 'negosim-backend.onrender.com';
      const hostname = window.location.hostname || 'localhost';
      const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';

      const API_BASE = isLocal
        ? 'http://localhost:8001/api'
        : `https://${RENDER_HOST}/api`;

      // ── Elements ─────────────────────────────────────────────────────
      const tabLogin      = document.getElementById('tab-login');
      const tabRegister   = document.getElementById('tab-register');
      const formLogin     = document.getElementById('form-login');
      const formRegister  = document.getElementById('form-register');
      const authTitle     = document.getElementById('auth-title');
      const authSubtitle  = document.getElementById('auth-subtitle');
      const authMessage   = document.getElementById('auth-message');
      const authMsgIcon   = document.getElementById('auth-message-icon');
      const authMsgText   = document.getElementById('auth-message-text');
      const authFooterText = document.getElementById('auth-footer-text');
      const authFooterLink = document.getElementById('auth-footer-link');

      // ── Check if already logged in ──────────────────────────────────
      const existingToken = localStorage.getItem('negosim_token');
      if (existingToken) {
        // Verify token is still valid
        fetch(`${API_BASE}/auth/me`, {
          headers: { 'Authorization': `Bearer ${existingToken}` }
        })
        .then(r => r.ok ? window.location.href = 'index.html' : null)
        .catch(() => localStorage.removeItem('negosim_token'));
      }

      // ── Tab Switching ───────────────────────────────────────────────
      let currentTab = 'login';

      function switchTab(tab) {
        currentTab = tab;
        hideMessage();

        tabLogin.classList.toggle('active', tab === 'login');
        tabRegister.classList.toggle('active', tab === 'register');
        formLogin.style.display    = tab === 'login' ? 'flex' : 'none';
        formRegister.style.display = tab === 'register' ? 'flex' : 'none';

        if (tab === 'login') {
          authTitle.textContent    = 'Welcome Back';
          authSubtitle.textContent = 'Sign in to your account to access the negotiation platform.';
          authFooterText.innerHTML = `Don't have an account? <button type="button" class="auth-footer-link" id="auth-footer-link">Create one</button>`;
        } else {
          authTitle.textContent    = 'Create Your Account';
          authSubtitle.textContent = 'Join NegoSim to start training your negotiation skills with AI agents.';
          authFooterText.innerHTML = `Already have an account? <button type="button" class="auth-footer-link" id="auth-footer-link">Sign in</button>`;
        }

        // Re-attach footer link listener
        document.getElementById('auth-footer-link')?.addEventListener('click', () => {
          switchTab(tab === 'login' ? 'register' : 'login');
        });
      }

      tabLogin.addEventListener('click', () => switchTab('login'));
      tabRegister.addEventListener('click', () => switchTab('register'));
      authFooterLink.addEventListener('click', () => switchTab('register'));

      // ── Message Display ─────────────────────────────────────────────
      function showMessage(type, text) {
        authMessage.className = `auth-message show ${type}`;
        authMsgIcon.textContent = type === 'error' ? '✕' : '✓';
        authMsgText.textContent = text;
      }

      function hideMessage() {
        authMessage.className = 'auth-message';
      }

      // ── Password Toggle ─────────────────────────────────────────────
      function setupPasswordToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input  = document.getElementById(inputId);
        if (!toggle || !input) return;

        toggle.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          toggle.title = isPassword ? 'Hide password' : 'Show password';
          toggle.innerHTML = isPassword
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }
      setupPasswordToggle('login-pw-toggle', 'login-password');
      setupPasswordToggle('register-pw-toggle', 'register-password');

      // ── Password Strength ───────────────────────────────────────────
      const regPwInput = document.getElementById('register-password');
      const pwBars     = [1, 2, 3, 4].map(i => document.getElementById(`pw-bar-${i}`));
      const pwLabel    = document.getElementById('pw-strength-label');

      function calcPasswordStrength(pw) {
        let score = 0;
        if (pw.length >= 6)  score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
        if (/\d/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return Math.min(score, 4);
      }

      regPwInput?.addEventListener('input', () => {
        const strength = calcPasswordStrength(regPwInput.value);
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        const classes = ['', 'weak', 'fair', 'good', 'strong'];

        pwBars.forEach((bar, i) => {
          bar.className = 'auth-pw-strength-bar';
          if (regPwInput.value.length > 0 && i < strength) {
            bar.classList.add('active', classes[strength]);
          }
        });

        pwLabel.textContent = regPwInput.value.length > 0 ? labels[strength] : '';
      });

      // ── Form Submit: Login ──────────────────────────────────────────
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const btn = document.getElementById('btn-login');
        btn.classList.add('loading');
        btn.disabled = true;

        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            showMessage('error', data.error?.message || 'Login failed. Please try again.');
            return;
          }

          // Store token and user info
          localStorage.setItem('negosim_token', data.token);
          localStorage.setItem('negosim_user', JSON.stringify(data.user));

          showMessage('success', 'Login successful! Redirecting...');

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);

        } catch (err) {
          showMessage('error', 'Unable to connect to the server. Please make sure the backend is running.');
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ── Form Submit: Register ───────────────────────────────────────
      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const btn = document.getElementById('btn-register');
        btn.classList.add('loading');
        btn.disabled = true;

        const name     = document.getElementById('register-name').value.trim();
        const email    = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;

        if (password.length < 6) {
          showMessage('error', 'Password must be at least 6 characters.');
          btn.classList.remove('loading');
          btn.disabled = false;
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            showMessage('error', data.error?.message || 'Registration failed. Please try again.');
            return;
          }

          // Auto-login after registration
          localStorage.setItem('negosim_token', data.token);
          localStorage.setItem('negosim_user', JSON.stringify(data.user));

          showMessage('success', `Welcome, ${data.user.name}! Redirecting...`);

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);

        } catch (err) {
          showMessage('error', 'Unable to connect to the server. Please make sure the backend is running.');
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ── Google Sign-In ──────────────────────────────────────────────
      // Initialize Google Identity Services when the library loads
      function initGoogleSignIn() {
        if (typeof google === 'undefined' || !google.accounts) {
          // Library not loaded yet — will be retried by btn click
          return;
        }

        google.accounts.id.initialize({
          client_id: '', // Will be populated from backend config
          callback: handleGoogleResponse,
          auto_select: false,
          cancel_on_tap_outside: true,
        });
      }

      async function handleGoogleResponse(response) {
        hideMessage();

        try {
          const res = await fetch(`${API_BASE}/auth/google`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential }),
          });

          const data = await res.json();

          if (!res.ok) {
            showMessage('error', data.error?.message || 'Google sign-in failed.');
            return;
          }

          localStorage.setItem('negosim_token', data.token);
          localStorage.setItem('negosim_user', JSON.stringify(data.user));

          showMessage('success', `Welcome, ${data.user.name}! Redirecting...`);

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);

        } catch (err) {
          showMessage('error', 'Google sign-in failed. Please try again.');
        }
      }

      // Manual Google button click
      document.getElementById('btn-google-login').addEventListener('click', () => {
        if (typeof google !== 'undefined' && google.accounts) {
          google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              showMessage('error', 'Google sign-in is not available. Please configure GOOGLE_CLIENT_ID in backend/.env');
            }
          });
        } else {
          showMessage('error', 'Google sign-in library failed to load. Please check your internet connection.');
        }
      });

      // Try to init Google Sign-In after a brief delay
      setTimeout(initGoogleSignIn, 500);

      // ── Keyboard shortcuts ──────────────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey) {
          // Tab between login/register with Ctrl+Tab or by pressing Tab at the end
        }
      });

    })();
  </script>

</body>

</html>
